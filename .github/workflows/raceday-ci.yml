name: RaceDay CI

on:
  push:
    branches: ["**"]

  pull_request:
    branches: ["main"]

  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore packages
        run: dotnet restore RaceDay_MVC/RaceDay.sln

      - name: Build solution
        run: dotnet build RaceDay_MVC/RaceDay.sln --no-restore --configuration Release

      - name: Run unit tests
        run: dotnet test RaceDay_MVC/RaceDay.sln --no-build --configuration Release --logger "trx;LogFileName=test-results.trx" --results-directory ./TestResults

      - name: Upload test results
        if: always()
       
