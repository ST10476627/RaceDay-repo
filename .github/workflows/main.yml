name: RaceDay CI

on:
  push:
    branches: [ "main" ]

  pull_request:
    branches: [ "main" ]

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Find solution or project
        shell: bash
        run: |
          FILE=$(find . -name "*.sln" -print -quit)

          if [ -z "$FILE" ]; then
            FILE=$(find . -name "*.csproj" -print -quit)
          fi

          if [ -z "$FILE" ]; then
            echo "No .sln or .csproj file found."
            exit 1
          fi

          echo "PROJECT_FILE=$FILE" >> $GITHUB_ENV
          echo "Using: $FILE"

      - name: Restore dependencies
        run: dotnet restore "${{ env.PROJECT_FILE }}"

      - name: Build project
        run: dotnet build "${{ env.PROJECT_FILE }}" --configuration Release --no-restore

      - name: Test project
        run: dotnet test "${{ env.PROJECT_FILE }}" --configuration Release --no-build
