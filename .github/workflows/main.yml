```yaml
name: main

on:
  push:
    branches: ["**"]

  pull_request:
    branches: ["main"]

  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore solution
        run: dotnet restore "RaceDay_API/RaceDay_API.sln"

      - name: Build solution
        run: dotnet build "RaceDay_API/RaceDay_API.sln" --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test "RaceDay_API/RaceDay_API.sln" --configuration Release --no-build --logger "trx;LogFileName=test-results.trx" --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RaceDay-Test-Results
          path: TestResults/*.trx
          if-no-files-found: ignore
```
